
name: My Custom Action

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  greet:
    runs-on: ubuntu-latest

    steps:
      - name: Run Hello Action
        id: hello
        uses: Muhammad-Roshaan-Idrees/hello-action@v1.0.0
        with:
          name: Roshaan Idrees

      - name: Display Greeting
        env:
          GREETING: ${{ steps.hello.outputs.greeting }}
        run: echo "$GREETING"
