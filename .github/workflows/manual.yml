name: Manual Workflow

on:
  workflow_dispatch:
    inputs:
      name:
        description: Enter your name
        required: true
        type: string
      greeting:
        description: Enter a greeting
        required: true
        default: Hello
        type: string
      data:
        description: Enter extra information
        required: false
        type: string

jobs:
  greet:
    runs-on: ubuntu-latest

    steps:
      - name: Display inputs
        env:
          PERSON: ${{ inputs.name }}
          GREETING: ${{ inputs.greeting }}
          EXTRA_DATA: ${{ inputs.data }}
        run: |
          echo "$GREETING, $PERSON!"
          echo "Extra data: $EXTRA_DATA"