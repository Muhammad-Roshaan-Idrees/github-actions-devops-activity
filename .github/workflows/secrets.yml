
name: Variables and Secrets

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure:
    runs-on: ubuntu-latest

    steps:
      - name: Display configuration
        env:
          APP: ${{ vars.APP_NAME }}
          TEST_SECRET: ${{ secrets.MY_SECRET }}
        run: |
          echo "App name: $APP"

          if [ -n "$TEST_SECRET" ]; then
            echo "Secret is configured"
          else
            echo "Secret is missing"
            exit 1
          fi

      - name: Check built-in token
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            echo "GitHub token is available"
          else
            echo "GitHub token is missing"
            exit 1
          fi
