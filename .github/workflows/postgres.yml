
name: PostgreSQL Service

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  database-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d testdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Test database connection
        env:
          PGPASSWORD: testpass
        run: |
          psql -h localhost -U testuser -d testdb \
            -c "SELECT 'Database is working' AS result;"
